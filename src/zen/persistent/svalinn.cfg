// Svalinn autoconfig bootloader. This file lives in Zen's installation
// directory and loads the profile-local trusted loader. It is installed only
// by `npm run zen:install`, after reviewing the installation-directory change.
if (!Services.appinfo.inSafeMode) {
  try {
    const manifest = Services.dirsvc.get("UChrm", Ci.nsIFile);
    manifest.append("svalinn");
    manifest.append("chrome.manifest");

    if (manifest.exists()) {
      Components.manager
        .QueryInterface(Ci.nsIComponentRegistrar)
        .autoRegister(manifest);
      ChromeUtils.importESModule("chrome://svalinn/content/loader.sys.mjs");
    }
  } catch (error) {
    // Never prevent Zen from starting.
    try {
      Services.prefs.setStringPref("svalinn.lastError", String(error));
    } catch {}
  }
}
